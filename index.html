<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Estação Shackleton</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#language-picker {
 position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
 background: #080b12; font-family: Arial, sans-serif; overflow: auto;
}
.language-card { max-width: 36rem; padding: 2rem; text-align: center; }
.language-card h1 { color: #6fd0ff; font-size: clamp(1.5rem, 5vw, 2.3rem); }
.language-card p { color: #c3c9d3; line-height: 1.6; }
.language-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: 2rem; }
.language-options button {
 background: #1a2233; color: white; border: 2px solid #6fd0ff;
 border-radius: .5rem; padding: 1rem 1.5rem; font-size: 1.1rem; cursor: pointer;
}
.language-options button:hover { background: #2a3448; }
.language-options button:focus-visible { outline: 3px solid #ffb648; outline-offset: 4px; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<section id="language-picker" aria-labelledby="language-title">
 <div class="language-card">
  <h1 id="language-title">Estação Shackleton<br><span lang="en">Shackleton Station</span></h1>
  <p>Escolha o idioma para iniciar.<br><span lang="en">Choose your language to begin.</span></p>
  <div class="language-options">
   <button type="button" data-language="pt-BR" lang="pt-BR" autofocus>Português (Brasil)</button>
   <button type="button" data-language="en" lang="en">English</button>
  </div>
 </div>
</section>
		<canvas id="canvas">
			Seu navegador não suporta canvas. / Your browser does not support canvas.
		</canvas>

		<noscript>
			Seu navegador não suporta JavaScript. / Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":905312,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
(async function () {
 const language = await new Promise((resolve) => {
  document.querySelectorAll('[data-language]').forEach((button) => {
   button.addEventListener('click', () => resolve(button.dataset.language), { once: true });
  });
 });
 const english = language === 'en';
 document.documentElement.lang = language;
 document.title = english ? 'Shackleton Station' : 'Estação Shackleton';
 document.getElementById('canvas').textContent = english
  ? 'Your browser does not support canvas.' : 'Seu navegador não suporta canvas.';
 document.getElementById('language-picker').remove();
 GODOT_CONFIG.mainPack = english ? 'index.en.pck' : 'index.pck';
 GODOT_CONFIG.args = ['--language', english ? 'en' : 'pt_BR'];
 GODOT_CONFIG.fileSizes['index.en.pck'] = 876512;
 const engine = new Engine(GODOT_CONFIG);
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
        setStatusNotice(english
            ? 'Unable to start the simulation. Reload the page and try again.'
            : 'Não foi possível iniciar a simulação. Recarregue a página e tente novamente.');
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = english ? 'Your browser does not support the features required to run the simulation.' : 'Seu navegador não suporta os recursos necessários para executar a simulação.';
			console.error(missingMsg, missing);
			setStatusNotice(missingMsg);
			setStatusMode('notice');
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
